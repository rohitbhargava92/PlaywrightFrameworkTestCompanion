# ============================================================
# Playwright CI Workflow
# ============================================================
# What this does:
#   - Runs the full Playwright test suite on every push/PR to main.
#   - Uploads the HTML report as an artifact (always, 14-day retention).
#   - Uploads screenshots/videos/traces only on failure.
#
# How to run manually:
#   GitHub → Actions tab → "Playwright Tests" → "Run workflow" button.
#
# Required repository variables (Settings → Secrets and variables → Actions):
#   vars.BASE_URL          — e.g. https://www.saucedemo.com
#   vars.STANDARD_USER     — e.g. standard_user
#   vars.LOCKED_OUT_USER   — e.g. locked_out_user
#   secrets.PASSWORD       — e.g. secret_sauce  (use a Secret, not a Var)
#
# Note: Sharding across multiple machines can be added later if the suite grows.
# ============================================================

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # Allows manual trigger from the Actions tab

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      STANDARD_USER: ${{ vars.STANDARD_USER }}
      LOCKED_OUT_USER: ${{ vars.LOCKED_OUT_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node 20 with npm caching for faster installs
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers and their OS-level dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Run the full test suite
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Upload the HTML report — always, even if tests failed
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # 7. Upload screenshots, videos and traces — only on failure
      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
